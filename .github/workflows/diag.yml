name: Diag
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: crt.sh
        run: |
          echo "=== crt.sh for abb.com ==="
          curl -sk -w "\nHTTP_STATUS=%{http_code} SIZE=%{size_download} TIME=%{time_total}\n" "https://crt.sh/?q=%.abb.com&output=json" -o /tmp/crt.json
          wc -c /tmp/crt.json
          head -c 300 /tmp/crt.json; echo
      - name: crt.sh again (2nd call, same runner)
        run: |
          curl -sk -w "\nHTTP_STATUS=%{http_code} SIZE=%{size_download} TIME=%{time_total}\n" "https://crt.sh/?q=%.365command.com&output=json" -o /tmp/crt2.json
          wc -c /tmp/crt2.json
      - name: Alienvault OTX
        run: curl -sk -w "\nHTTP_STATUS=%{http_code}\n" "https://otx.alienvault.com/api/v1/indicators/domain/abb.com/passive_dns" -o /tmp/otx.json; wc -c /tmp/otx.json; head -c 300 /tmp/otx.json; echo
      - name: Certspotter
        run: curl -sk -w "\nHTTP_STATUS=%{http_code}\n" "https://api.certspotter.com/v1/issuances?domain=abb.com&include_subdomains=true&expand=dns_names" -o /tmp/cs.json; wc -c /tmp/cs.json; head -c 300 /tmp/cs.json; echo
      - name: subdomain.center
        run: curl -sk -w "\nHTTP_STATUS=%{http_code}\n" "https://api.subdomain.center/?domain=abb.com" -o /tmp/sc.json; wc -c /tmp/sc.json; head -c 300 /tmp/sc.json; echo
