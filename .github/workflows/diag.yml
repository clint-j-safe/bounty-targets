name: Diag
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - name: Install tools
        run: |
          sudo apt-get install -y --no-install-recommends parallel jq curl
          go install github.com/tomnomnom/anew@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          wget -q https://github.com/Findomain/Findomain/releases/download/8.2.1/findomain-linux.zip
          unzip -q findomain-linux.zip && chmod +x findomain && sudo mv findomain /usr/local/bin/
      - name: Clone SubDomz and check line endings
        run: |
          git clone --depth 1 https://github.com/0xPugal/SubDomz.git "$RUNNER_TEMP/SubDomz"
          echo "=== before normalization ==="
          file "$RUNNER_TEMP/SubDomz/SubDomz.sh"
          git config --get core.autocrlf || echo "(unset)"
          for f in "$RUNNER_TEMP/SubDomz"/*.sh; do tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          sed -i '/^Puredns() {$/i }' "$RUNNER_TEMP/SubDomz/SubDomz.sh"
          echo "=== bash -n check ==="
          bash -n "$RUNNER_TEMP/SubDomz/SubDomz.sh" && echo OK
          echo "=== after normalization ==="
          file "$RUNNER_TEMP/SubDomz/SubDomz.sh"
          : > "$RUNNER_TEMP/SubDomz/config.txt"
      - name: Run SubDomz against abb.com with the NEW source list
        run: |
          cd "$RUNNER_TEMP/SubDomz"
          time bash ./SubDomz.sh -d abb.com -u "Subfinder,Assetfinder,Findomain,JLDC,Subdomain-center,Certspotter" -s
          echo "=== result file ==="
          wc -l subdomz-abb.com.txt || echo "NO FILE PRODUCED"
          head -30 subdomz-abb.com.txt || true
